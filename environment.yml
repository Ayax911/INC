name: inc-combined
channels:
  - conda-forge
  - defaults
  - https://repo.anaconda.com/pkgs/main
  - https://repo.anaconda.com/pkgs/r

dependencies:
  # Base
  - python=3.10
  - pip
  - setuptools
  - wheel

  # Scientific stack
  - numpy
  - pandas
  - scipy
  - bottleneck
  - numexpr
  - scikit-learn
  - scikit-image
  - imageio
  - matplotlib
  - pillow

  # Jupyter / dev
  - ipykernel
  - ipython
  - jupyter_client
  - jupyter_core
  - debugpy

  # Imaging / medical / vision
  - opencv
  - pydicom

  # GUI (del env inc-mvp)
  - pyside6
  - qtbase
  - qtdeclarative
  - qttools
  - qtsvg
  - qtwebengine
  - qtwebchannel
  - qtwebsockets
  - qtshadertools

  # OCR / multimedia (del env inc-mvp)
  - tesseract
  - leptonica
  - ffmpeg

  # Misc
  - pyyaml
  - requests

  - pip:
      # General
      - polars==1.36.1
      - polars-runtime-32==1.36.1

      # Ultralytics (ambos entornos)
      - ultralytics==8.3.235
      - ultralytics-thop==2.0.18

      # PyTorch stack (elige UNA familia; aquí dejo la más nueva de tus dos)
      - torch==2.9.1
      - torchvision==0.24.1
      - triton==3.5.1

      # CUDA wheels (coherentes con torch 2.9.1 en tu segundo env)
      - nvidia-cublas-cu12==12.8.4.1
      - nvidia-cuda-cupti-cu12==12.8.90
      - nvidia-cuda-nvrtc-cu12==12.8.93
      - nvidia-cuda-runtime-cu12==12.8.90
      - nvidia-cudnn-cu12==9.10.2.21
      - nvidia-cufft-cu12==11.3.3.83
      - nvidia-cufile-cu12==1.13.1.3
      - nvidia-curand-cu12==10.3.9.90
      - nvidia-cusolver-cu12==11.7.3.90
      - nvidia-cusparse-cu12==12.5.8.93
      - nvidia-cusparselt-cu12==0.7.1
      - nvidia-nccl-cu12==2.27.5
      - nvidia-nvjitlink-cu12==12.8.93
      - nvidia-nvshmem-cu12==3.3.20
      - nvidia-nvtx-cu12==12.8.90
