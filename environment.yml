name: inc-combined
channels:
  - conda-forge
  - defaults
  - https://repo.anaconda.com/pkgs/main
  - https://repo.anaconda.com/pkgs/r

dependencies:
  # Base
  - python=3.10
  - pip
  - setuptools
  - wheel

  # Scientific stack
  - numpy
  - pandas
  - scipy
  - bottleneck
  - numexpr
  - scikit-learn
  - scikit-image
  - imageio
  - matplotlib
  - pillow

  # Jupyter / dev
  - ipykernel
  - ipython
  - jupyter_client
  - jupyter_core
  - debugpy

  # Imaging / medical / vision
  - opencv
  - pydicom

  # GUI (del env inc-mvp)
  - pyside6
  - qtbase
  - qtdeclarative
  - qttools
  - qtsvg
  - qtwebengine
  - qtwebchannel
  - qtwebsockets
  - qtshadertools

  # OCR / multimedia (del env inc-mvp)
  - tesseract
  - leptonica
  - ffmpeg

  # Misc
  - pyyaml
  - requests
  - natsort

  - pip:
      # El índice por defecto (PyPI) sirve para todo menos torch/torchvision --
      # ver el bloque "PyTorch stack" más abajo.
      - --extra-index-url https://download.pytorch.org/whl/cu126

      # General
      - polars==1.36.1
      - polars-runtime-32==1.36.1

      # Ya se importaban en el código (metrics.py, training.py) sin estar
      # declaradas acá -- necesarias para las 6 métricas por torchmetrics,
      # el tracking de experimentos, las gráficas de test/val, y el
      # metrics.csv/TensorBoard por época (ver reporting_extras.py).
      - wandb
      - seaborn
      - torchmetrics
      - tensorboard

      # Ultralytics (ambos entornos)
      - ultralytics==8.3.235
      - ultralytics-thop==2.0.18

      # --- Importados por src/models/*/training.py y train.py ---
      # No estaban listados y sin ellos las tres variantes de clasificación
      # revientan en el import, antes de parsear un solo flag:
      #   wandb       -> training.py de las tres variantes (wandb.init)
      #   torchmetrics-> metrics.py de classification_data_clinic
      #   natsort     -> dataloaders/ de classification_images y _final
      #   seaborn     -> matriz de confusión en utils/plots de las tres
      #   tqdm        -> barras de progreso del bucle de entrenamiento
      - wandb
      - torchmetrics
      - natsort
      - seaborn
      - tqdm

      # --- PyTorch stack ---
      # OBLIGATORIO el sufijo +cu126 (y el --extra-index-url de arriba): las
      # ruedas cu128 que PyPI sirve para torch==2.9.1 NO traen kernels Pascal
      # (arch list sm_70..sm_120). En la GTX 1080 Ti (sm_61) de la workstation
      # eso NO falla al instalar ni en torch.cuda.is_available() -- que
      # devuelve True -- sino en la primera operación real, con
      #   CUDA error: no kernel image is available for execution on the device
      # La rueda cu126 se compila para sm_50..sm_90 y Pascal corre los cubins
      # de sm_60. Solo quita el +cu126 si migras a una GPU Volta o posterior.
      - torch==2.9.1+cu126
      - torchvision==0.24.1+cu126
      - triton==3.5.1

      # Las nvidia-*-cu12 ya NO se fijan a mano: la rueda cu126 de torch
      # arrastra exactamente las suyas (12.6.x). Los pines 12.8.* que había
      # aquí venían de la instalación cu128 y contradicen la línea de arriba.
